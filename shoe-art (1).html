<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoe Art — Footwear in Lahore</title>
<meta name="description" content="Shoe Art, Ferozepur Road Lahore. Men's, women's and kids' footwear — joggers, dress shoes, sports shoes and Peshawari chappal. Order on WhatsApp or visit the store.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --fg:#000000;
  --surface:#FFFFFF;
  --surface-2:#EFE6D8;
  --surface-3:#E4D8C4;
  --line:#E0D8CA;
  --muted:#5F5B54;
  --gold:#8F6413;
  --gold-solid:#B5822E;
  --on-gold:#FFFFFF;
  --green:#1E8A4B;
  --sale:#9A2515;

  --wrap:1180px;
  --pad:clamp(16px,4vw,40px);
  --r-s:4px;
  --r-m:10px;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0B0A; --fg:#F4F0E9; --surface:#131110; --surface-2:#1C1814;
    --surface-3:#282219; --line:#2C2823; --muted:#A8A199; --gold:#DDA84F;
    --gold-solid:#C68E33; --on-gold:#121008; --green:#4CC17E; --sale:#E36A54;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0B0A; --fg:#F4F0E9; --surface:#131110; --surface-2:#1C1814;
  --surface-3:#282219; --line:#2C2823; --muted:#A8A199; --gold:#DDA84F;
  --gold-solid:#C68E33; --on-gold:#121008; --green:#4CC17E; --sale:#E36A54;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:Karla,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;overflow-x:hidden;
}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold-solid);outline-offset:3px;border-radius:2px}

h1,h2,h3,.disp{
  font-family:Archivo,"Arial Narrow",system-ui,sans-serif;
  font-variation-settings:"wdth" 112,"wght" 800;
  line-height:.98;letter-spacing:-.02em;margin:0;text-transform:none;
}
h1{font-size:clamp(2.6rem,8.5vw,5.4rem)}
h2{font-size:clamp(1.9rem,4.6vw,3.1rem)}
h3{font-size:1.06rem;font-variation-settings:"wdth" 108,"wght" 700;line-height:1.25;letter-spacing:-.01em}
p{margin:0 0 1em}
.lede{font-size:clamp(1rem,2.2vw,1.18rem);color:var(--muted);max-width:52ch}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--pad)}
.sec{padding-block:clamp(48px,7vw,86px)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:clamp(20px,3vw,34px)}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 24px;border:1.5px solid var(--fg);background:var(--fg);color:var(--bg);
  border-radius:var(--r-s);font-weight:700;font-size:.95rem;letter-spacing:.01em;
  text-decoration:none;transition:background .15s,color .15s,border-color .15s;
}
.btn:hover{background:var(--gold-solid);border-color:var(--gold-solid);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.wa{background:var(--green);border-color:var(--green);color:#fff}
.btn.wa:hover{filter:brightness(1.08);background:var(--green);border-color:var(--green);color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link-u{color:inherit;text-decoration:none;border-bottom:1.5px solid var(--gold-solid);padding-bottom:2px;font-weight:700;font-size:.95rem}

/* ---------- header ---------- */
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.hdr-in{display:flex;align-items:center;gap:18px;height:66px;max-width:var(--wrap);margin:0 auto;padding-inline:var(--pad)}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;margin-right:auto}
.logo b{font-family:Archivo;font-variation-settings:"wdth" 118,"wght" 900;font-size:1.32rem;letter-spacing:-.03em}
.logo span{font-size:.68rem;color:var(--muted);letter-spacing:.14em}
.nav{display:flex;gap:22px}
.nav a{text-decoration:none;font-size:.93rem;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{border-bottom-color:var(--gold-solid)}
.nav a.sale-link{color:var(--sale);font-weight:700}
.hdr-act{display:flex;align-items:center;gap:6px}
.icobtn{background:none;border:0;padding:9px;border-radius:50%;display:grid;place-items:center;position:relative}
.icobtn:hover{background:var(--surface-2)}
.badge{
  position:absolute;top:1px;right:1px;min-width:18px;height:18px;padding:0 4px;
  background:var(--gold-solid);color:var(--on-gold);border-radius:9px;
  font-size:.68rem;font-weight:700;display:grid;place-items:center;line-height:1;
}
@media (max-width:860px){.nav{display:none}}

/* ---------- hero ---------- */
.hero{background:var(--surface-2);border-bottom:1px solid var(--line);overflow:hidden}
.hero-in{
  max-width:var(--wrap);margin:0 auto;padding:clamp(34px,6vw,70px) var(--pad) 0;
  display:grid;gap:clamp(10px,3vw,40px);grid-template-columns:1.05fr .95fr;align-items:center;
}
.hero-copy{padding-bottom:clamp(34px,6vw,70px)}
.hero h1{margin-bottom:18px}
.hero h1 em{font-style:normal;display:block}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero-meta{margin-top:26px;font-size:.88rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px}
.hero-art{position:relative;align-self:end;min-height:240px;display:grid;place-items:center}
.hero-art .disc{
  position:absolute;width:min(78%,420px);aspect-ratio:1;border-radius:50%;
  background:var(--surface-3);
}
.hero-art .shoe{position:relative;width:min(100%,520px);transform:rotate(-7deg)}
.reveal{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
.reveal-2{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:820px){
  .hero-in{grid-template-columns:1fr;padding-top:clamp(26px,7vw,40px)}
  .hero-copy{padding-bottom:22px;order:2}
  .hero-art{order:1;min-height:0}
  .hero-art .shoe{max-width:400px}
}

/* ---------- category rail ---------- */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cat{
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);
  padding:16px 12px 14px;text-align:center;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s,background .15s;
}
.cat:hover{border-color:var(--gold-solid);background:var(--surface-2)}
.cat svg{width:100%;height:auto}
.cat b{font-size:.9rem;font-weight:700}
@media (max-width:900px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.cats{grid-template-columns:repeat(2,1fr)}}

/* ---------- product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,22px)}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);
  overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;
  transition:border-color .15s;
}
.card:hover{border-color:var(--gold-solid)}
.card-img{position:relative;background:var(--surface-2);padding:14px;aspect-ratio:4/3;display:grid;place-items:center}
.card-img svg{width:100%;height:auto}
.tag{
  position:absolute;top:10px;left:10px;background:var(--sale);color:#fff;
  font-size:.7rem;font-weight:700;padding:4px 8px;border-radius:3px;letter-spacing:.02em;
}
.card-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body h3{min-height:2.5em}
.stars{color:var(--gold);font-size:.82rem;letter-spacing:.08em}
.stars span{color:var(--muted);letter-spacing:0;margin-left:5px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}
.price b{font-family:Archivo;font-variation-settings:"wdth" 110,"wght" 700;font-size:1.12rem;letter-spacing:-.01em}
.price s{color:var(--muted);font-size:.86rem}
.save{color:var(--sale);font-size:.78rem;font-weight:700}
.card .btn{margin-top:10px;padding:11px 14px;font-size:.88rem}

/* ---------- filters ---------- */
.shop-layout{display:grid;grid-template-columns:230px 1fr;gap:clamp(18px,3vw,40px);align-items:start}
@media (max-width:860px){.shop-layout{grid-template-columns:1fr}}
.filters{border:1px solid var(--line);border-radius:var(--r-m);padding:18px;background:var(--surface);position:sticky;top:96px}
@media (max-width:860px){.filters{position:static}}
.fgroup{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.fgroup:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
.fgroup h4{margin:0 0 9px;font-size:.82rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1.5px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 13px;font-size:.85rem;transition:.15s;
}
.chip:hover{border-color:var(--gold-solid)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.shop-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.count{color:var(--muted);font-size:.9rem}
select{
  border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  padding:10px 14px;border-radius:var(--r-s);font:inherit;font-size:.9rem;
}
.empty{border:1px dashed var(--line);border-radius:var(--r-m);padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- sale banner ---------- */
.saleband{background:var(--fg);color:var(--bg);border-radius:var(--r-m);padding:clamp(26px,5vw,52px);display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.saleband h2{font-size:clamp(2.2rem,6vw,4rem);font-variation-settings:"wdth" 118,"wght" 900}
.saleband p{color:#bbb5aa;margin:10px 0 22px;max-width:40ch}
:root[data-theme="dark"] .saleband p,.saleband p{color:color-mix(in srgb,var(--bg) 62%,var(--fg))}
.saleband .btn{background:var(--gold-solid);border-color:var(--gold-solid);color:var(--on-gold)}
.saleband .btn:hover{background:var(--bg);border-color:var(--bg);color:var(--fg)}
.saleband svg{width:100%;height:auto}
@media (max-width:760px){.saleband{grid-template-columns:1fr}.saleband .art{display:none}}

/* ---------- trust ---------- */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,2vw,26px)}
@media (max-width:860px){.trust{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.trust{grid-template-columns:1fr}}
.trust div{border-top:2px solid var(--gold-solid);padding-top:14px}
.trust p{color:var(--muted);font-size:.92rem;margin:6px 0 0}

/* ---------- reviews ---------- */
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,20px)}
@media (max-width:820px){.revs{grid-template-columns:1fr}}
.rev{background:var(--surface-2);border-radius:var(--r-m);padding:22px}
.rev p{font-size:1.02rem;margin:10px 0 14px}
.rev b{font-size:.88rem}
.rev small{color:var(--muted);display:block;font-size:.8rem}

/* ---------- instagram ---------- */
.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:760px){.ig{grid-template-columns:repeat(3,1fr)}}
.ig a{aspect-ratio:1;background:var(--surface-2);border-radius:var(--r-s);display:grid;place-items:center;padding:10px;text-decoration:none;transition:.15s}
.ig a:hover{background:var(--surface-3)}

/* ---------- store ---------- */
.store{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,40px);align-items:center}
@media (max-width:760px){.store{grid-template-columns:1fr}}
.map{
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2);
  min-height:260px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;
}
.map .grid-lines{position:absolute;inset:0;opacity:.5}
.map .pin{position:relative}
.addr{font-style:normal;line-height:1.75}
.hours{width:100%;border-collapse:collapse;margin:16px 0 22px;font-size:.92rem}
.hours td{padding:7px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;color:var(--muted)}

/* ---------- footer ---------- */
footer{background:var(--surface-2);border-top:1px solid var(--line);padding-block:clamp(36px,5vw,60px) 0;margin-top:clamp(40px,6vw,80px)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:clamp(18px,3vw,40px)}
@media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
.fgrid h4{margin:0 0 12px;font-size:.84rem;letter-spacing:.06em;color:var(--muted)}
.fgrid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.fgrid a{text-decoration:none;font-size:.93rem}
.fgrid a:hover{color:var(--gold)}
.fbot{border-top:1px solid var(--line);margin-top:34px;padding:18px 0 calc(22px + env(safe-area-inset-bottom,0px));font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
@media (max-width:860px){footer{padding-bottom:64px}}

/* ---------- mobile bottom nav ---------- */
.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  grid-template-columns:repeat(5,1fr);
}
.bnav a{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  text-decoration:none;font-size:.68rem;font-weight:600;color:var(--muted);position:relative;
}
.bnav a.on{color:var(--fg)}
.bnav .badge{top:0;right:18%}
@media (max-width:860px){.bnav{display:grid}}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:100;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);
}
.drawer.open{transform:none}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-hd h3{font-size:1.18rem}
.drawer-body{flex:1;overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch}
.drawer-ft{border-top:1px solid var(--line);padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.ln{display:flex;justify-content:space-between;font-size:.95rem}
.ln.tot{font-family:Archivo;font-variation-settings:"wdth" 110,"wght" 700;font-size:1.2rem;margin-top:4px}

.citem{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.citem .thumb{background:var(--surface-2);border-radius:var(--r-s);padding:8px;display:grid;place-items:center}
.citem h4{margin:0 0 3px;font-size:.92rem;font-weight:700;line-height:1.3}
.citem small{color:var(--muted);font-size:.8rem}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border:1.5px solid var(--line);background:transparent;border-radius:4px;display:grid;place-items:center;line-height:1}
.rm{background:none;border:0;color:var(--muted);font-size:.78rem;text-decoration:underline;padding:4px 0}

.modal{
  position:fixed;inset:auto 0 0 0;top:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:clamp(0px,4vw,40px);pointer-events:none;opacity:0;transition:opacity .2s;
}
.modal.open{pointer-events:auto;opacity:1}
.sheet{
  background:var(--bg);width:min(980px,100%);border-radius:var(--r-m);
  border:1px solid var(--line);margin:auto;position:relative;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet-close{position:absolute;top:10px;right:10px;z-index:2;background:var(--bg);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,34px);padding:clamp(16px,3vw,30px)}
@media (max-width:780px){.pdp{grid-template-columns:1fr}}
.gal-main{background:var(--surface-2);border-radius:var(--r-m);padding:22px;display:grid;place-items:center;aspect-ratio:4/3}
.gal-thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.gal-thumbs button{background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-s);padding:6px;aspect-ratio:1;display:grid;place-items:center}
.gal-thumbs button.on{border-color:var(--gold-solid)}
.gal-thumbs small{position:absolute;opacity:0}
.pdp h2{font-size:clamp(1.5rem,3.4vw,2.1rem);margin-bottom:8px}
.pdp .price{margin:12px 0 18px}
.pdp .price b{font-size:1.7rem}
.opt h4{margin:0 0 8px;font-size:.84rem;letter-spacing:.05em;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.size{min-width:46px;padding:10px 6px;border:1.5px solid var(--line);background:transparent;border-radius:var(--r-s);font-weight:600;font-size:.92rem}
.size:hover{border-color:var(--gold-solid)}
.size.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.size.out{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.swatches{display:flex;gap:10px;margin-bottom:18px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border-color:var(--gold-solid);box-shadow:0 0 0 2px var(--bg) inset}
.pdp-cta{display:flex;flex-direction:column;gap:10px;margin:8px 0 18px}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{padding:14px 0;font-weight:700;font-size:.95rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--gold)}
.acc details[open] summary::after{content:"–"}
.acc ul{margin:0 0 14px;padding-left:18px;color:var(--muted);font-size:.93rem}
.acc p{color:var(--muted);font-size:.93rem}
.note{font-size:.84rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:.85rem;font-weight:700}
.field input,.field textarea,.field select{
  border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  padding:12px 14px;border-radius:var(--r-s);font:inherit;font-size:.95rem;width:100%;
}
.field input:focus,.field textarea:focus{border-color:var(--gold-solid)}
.err{color:var(--sale);font-size:.8rem}
.pay{display:flex;flex-direction:column;gap:8px}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r-s);padding:12px 14px;font-size:.93rem;font-weight:500;cursor:pointer}

/* ---------- catalogue ---------- */
const P = [

  {id:8,  name:"Women's Walking Jogger",    g:"Women", c:"Joggers",   type:"sneaker",   price:3799, was:4599, rating:4.5, revs:22, colors:[["Blush","#D9A79C"],["White","#F2EFE9"]], sizes:[36,37,38,39,40], out:[], sole:"Lightweight foam sole", material:"Knit mesh upper", use:"Walking, daily wear"},
  {id:9,  name:"Flat Slip-On",              g:"Women", c:"Casual",    type:"flat",      price:1899, was:2499, rating:4,   revs:9,  colors:[["Beige","#D8C4A6"],["Black","#1B1B1B"]], sizes:[36,37,38,39,40], out:[], sole:"Flexible flat sole", material:"Soft fabric upper", use:"Home, market, casual"},

  {id:11, name:"Kids School Shoe",          g:"Kids",  c:"Dress",     type:"dress",     price:2199, was:0,    rating:4.5, revs:17, colors:[["Black","#141414"]], sizes:[28,29,30,31,32,33,34], out:[34], sole:"Anti-slip sole", material:"Wipe-clean synthetic upper", use:"School uniform"},
  {id:12, name:"Trail Sports Shoe",         g:"Men",   c:"Sports",    type:"sports",    price:6499, was:7999, rating:5,   revs:7,  colors:[["Olive","#4E5A3A"],["Black","#1A1A1A"]], sizes:[40,41,42,43,44,45], out:[], sole:"Deep-tread rubber sole", material:"Water-resistant synthetic", use:"Hiking, outdoor walking"}

const CATS = [
  {label:"Dress shoes", q:"c=Dress",     type:"dress",     col:"#1D1D1D"},
  {label:"Joggers",     q:"c=Joggers",   type:"sneaker",   col:"#EDE7DC"},
  {label:"Casual",      q:"c=Casual",    type:"flat",      col:"#9A6B3C"},

  {label:"Peshawari",   q:"c=Peshawari", type:"peshawari", col:"#B07E44"},
  {label:"Women's",     q:"g=Women",     type:"heel",      col:"#C9A48A"}
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rs = n => "Rs. " + n.toLocaleString("en-PK");
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function starRow(r, n){
  const full = "★".repeat(Math.floor(r)) + (r % 1 ? "½" : "");
  return `<div class="stars">${full}<span>${n} reviews</span></div>`;
}
function waLink(text){ return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(text)}`; }
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- cart (per-browser convenience only) ---------- */
let cart = [];
try{ const raw = localStorage.getItem("shoeart_cart"); if(raw) cart = JSON.parse(raw) || []; }catch(e){ cart = []; }
function saveCart(){ try{ localStorage.setItem("shoeart_cart", JSON.stringify(cart)); }catch(e){} }
const cartTotal = () => cart.reduce((s, i) => s + i.price * i.qty, 0);
const cartQty = () => cart.reduce((s, i) => s + i.qty, 0);

function addToCart(p, size, colorName, qty){
  const key = p.id + "|" + size + "|" + colorName;
  const found = cart.find(i => i.key === key);
  if(found) found.qty += qty || 1;
  else cart.push({key, id:p.id, name:p.name, price:p.price, size, color:colorName, qty:qty || 1, type:p.type, hex:(p.colors.find(c => c[0] === colorName) || p.colors[0])[1]});
  saveCart(); paintCart(); toast(p.name + " added to cart");
}
function paintCart(){
  const n = cartQty();
  ["#cartCount", "#cartCount2"].forEach(sel => {
    const el = $(sel); if(!el) return;
    el.textContent = n; el.classList.toggle("hide", n === 0);
  });
  const body = $("#cartBody"), foot = $("#cartFoot");
  if(!cart.length){
    body.innerHTML = `<div class="empty"><p><b>Your cart is empty.</b></p><p style="margin:0">Browse the shop and pick a size to get started.</p></div>`;
    foot.innerHTML = `<a class="btn wide" href="#/shop" data-nav>Start shopping</a>`;
    return;
  }
  body.innerHTML = cart.map(i => `
    <div class="citem">
      <div class="thumb">${shoe(i.type, i.hex, "#2A2A2A", 0)}</div>
      <div>
        <h4>${esc(i.name)}</h4>
        <small>Size ${esc(i.size)} · ${esc(i.color)}</small>
        <div class="qty">
          <button data-q="-1" data-k="${esc(i.key)}" aria-label="Reduce quantity">−</button>
          <span>${i.qty}</span>
          <button data-q="1" data-k="${esc(i.key)}" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <b>${rs(i.price * i.qty)}</b><br>
        <button class="rm" data-rm="${esc(i.key)}">Remove</button>
      </div>
    </div>`).join("");
  const sub = cartTotal(), ship = sub >= CONFIG.freeOver ? 0 : CONFIG.shipFlat;
  foot.innerHTML = `
    <div class="ln"><span>Subtotal</span><span>${rs(sub)}</span></div>
    <div class="ln"><span>Delivery</span><span>${ship ? rs(ship) : "Free"}</span></div>
    <div class="ln tot"><span>Total</span><span>${rs(sub + ship)}</span></div>
    <a class="btn wide" href="#/checkout" data-nav id="toCheckout">Checkout</a>
    <a class="btn wa wide" href="${waLink(waCartText())}" target="_blank" rel="noopener">Send order on WhatsApp</a>`;
}
function waCartText(){
  const lines = cart.map(i => `• ${i.name} — size ${i.size}, ${i.color} × ${i.qty} — ${rs(i.price * i.qty)}`);
  return `Assalam o Alaikum ${CONFIG.brand}, I would like to order:\n\n${lines.join("\n")}\n\nTotal: ${rs(cartTotal())}\n\nPlease confirm availability and delivery.`;
}
$("#cartBody").addEventListener("click", e => {
  const q = e.target.closest("[data-q]"), r = e.target.closest("[data-rm]");
  if(q){
    const it = cart.find(i => i.key === q.dataset.k);
    if(it){ it.qty += +q.dataset.q; if(it.qty < 1) cart = cart.filter(i => i.key !== it.key); saveCart(); paintCart(); }
  }
  if(r){ cart = cart.filter(i => i.key !== r.dataset.rm); saveCart(); paintCart(); }
});

/* ---------- drawer + modal ---------- */
function openCart(){ $("#cartDrawer").classList.add("open"); $("#cartDrawer").setAttribute("aria-hidden","false"); $("#scrim").classList.add("open"); document.body.style.overflow = "hidden"; }
function closeAll(){
  $("#cartDrawer").classList.remove("open"); $("#cartDrawer").setAttribute("aria-hidden","true");
  $("#pdpModal").classList.remove("open"); $("#scrim").classList.remove("open"); document.body.style.overflow = "";
}
$("#cartBtn").onclick = openCart;
$("#bnavCart").onclick = e => { e.preventDefault(); openCart(); };
$("#cartClose").onclick = closeAll;
$("#scrim").onclick = closeAll;
$("#pdpClose").onclick = closeAll;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeAll(); });
$("#bnavWa").onclick = e => { e.preventDefault(); window.open(waLink(`Assalam o Alaikum ${CONFIG.brand}, I have a question about your footwear.`), "_blank", "noopener"); };

/* ---------- theme ---------- */
try{ const t = localStorage.getItem("shoeart_theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem("shoeart_theme", next); }catch(e){}
};

/* ---------- product card ---------- */
function card(p){
  const off = p.was ? Math.round((1 - p.price / p.was) * 100) : 0;
  return `
  <article class="card">
    <div class="card-img">
      ${off ? `<span class="tag">${off}% off</span>` : ""}
      ${shoe(p.type, p.colors[0][1], "#2A2A2A", 0)}
    </div>
    <div class="card-body">
      <h3>${esc(p.name)}</h3>
      ${starRow(p.rating, p.revs)}

function runFilters(){
  let list = P.slice();
  if(F.g) list = list.filter(p => p.g === F.g);
  if(F.c) list = list.filter(p => p.c === F.c);
  if(F.sale) list = list.filter(p => p.was > 0);
  if(F.price){ const [a, b] = F.price.split("-").map(Number); list = list.filter(p => p.price >= a && p.price <= b); }
  if(F.sort === "lo") list.sort((x, y) => x.price - y.price);
  if(F.sort === "hi") list.sort((x, y) => y.price - x.price);
  if(F.sort === "new") list.sort((x, y) => y.id - x.id);
  if(F.sort === "pop") list.sort((x, y) => y.revs - x.revs);

  const res = $("#results"); if(!res) return;
  $("#count").textContent = list.length + (list.length === 1 ? " product" : " products");
  res.innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty" style="grid-column:1/-1"><p><b>No shoes match these filters.</b></p><p style="margin:0">Clear a filter, or message us on WhatsApp and we will check the stock room.</p></div>`;
}
function wireShop(){
  const sortEl = $("#sort"); if(sortEl){ sortEl.value = F.sort; sortEl.onchange = () => { F.sort = sortEl.value; runFilters(); }; }
  document.querySelectorAll(".filters .chips").forEach(box => {
    box.onclick = e => {
      const b = e.target.closest(".chip"); if(!b) return;
      const k = box.dataset.f, v = b.dataset.v;
      if(k === "sale") F.sale = !F.sale;
      else F[k] = F[k] === v ? "" : v;
      render(location.hash, true);
    };
  });
  const cf = $("#clearF"); if(cf) cf.onclick = () => { F = {g:"", c:"", price:"", sale:false, sort:F.sort}; render("#/shop", true); };
  runFilters();
}

function wireCheckout(){

    const d = Object.fromEntries(new FormData(f).entries());

    const ref = "SA-" + Date.now().toString().slice(-6);

/* ---------- router ---------- */
function parseHash(h){
  const [path, qs] = (h || "#/").replace(/^#/, "").split("?");
  const q = new URLSearchParams(qs || "");
  return {path: path || "/", q};
}
function render(h, keepFilters){
  const {path, q} = parseHash(h || location.hash);
  if(path === "/shop" && !keepFilters){
    F = {g:q.get("g") || "", c:q.get("c") || "", price:q.get("price") || "", sale:q.get("sale") === "1", sort:F.sort};
  }
  let html = "";
  if(path === "/shop") html = shopPage();
  else if(path === "/checkout") html = checkoutPage();
  else if(path === "/done") html = donePage();
  else if(path === "/about") html = aboutPage();
  else if(path === "/contact") html = contactPage();
  else html = homePage();

  $("#app").innerHTML = html + footerHTML();
  $("#yr").textContent = new Date().getFullYear();

  const page = path === "/" ? "home" : path.slice(1);
  document.querySelectorAll("[data-page]").forEach(a => a.classList.toggle("on", a.dataset.page === page));

  if(path === "/shop") wireShop();
  if(path === "/checkout") wireCheckout();
  if(!keepFilters) window.scrollTo({top:0, behavior:"instant"});
  paintCart();
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-nav]");
  if(a){ closeAll(); }
});
window.addEventListener("hashchange", () => render(location.hash));
render(location.hash);
paintCart();
</script>
